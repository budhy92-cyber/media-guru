<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Masuk - CBT B-TEK</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f0f4f8;
            background-image: radial-gradient(#d7e1ec 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container { 
            background: white; 
            padding: 45px 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            border-top: 6px solid #6e8efb;
        }
        .karakter { font-size: 55px; margin-bottom: 10px; line-height: 1; }
        h2 { margin: 0 0 10px 0; color: #2f3542; font-size: 24px; }
        p.subtitle { color: #747d8c; font-size: 14px; margin-bottom: 35px; line-height: 1.5; }
        
        /* TOMBOL GOOGLE UTAMA */
        .btn-google { 
            width: 100%;
            background: white; 
            color: #333; 
            border: 2px solid #e1e8ed; 
            border-radius: 12px;
            padding: 15px;
            font-weight: 600;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-google:hover { 
            background: #f8fafc; 
            border-color: #6e8efb;
            box-shadow: 0 4px 15px rgba(110, 142, 251, 0.15);
            transform: translateY(-2px);
        }
        .btn-google img { width: 22px; }
        
        /* Tombol kembali ke Beranda */
        .kembali { 
            display: inline-block; 
            margin-top: 30px; 
            color: #64748b; 
            font-size: 13px; 
            text-decoration: none; 
            font-weight: 600; 
            transition: 0.3s; 
        }
        .kembali:hover { color: #3742fa; }
    </style>
</head>
<body>

<div class="container">
    <div class="karakter">👋🏫</div>
    <h2>Selamat Datang!</h2>
    <p class="subtitle">Masuk dengan cepat menggunakan akun Google (Gmail atau Belajar.id) Anda.</p>

  <!-- HANYA TOMBOL LOGIN GOOGLE -->
    <button class="btn-google" onclick="loginDenganGoogle()">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google Logo">
        Lanjutkan dengan Google
    </button>
    
    <!-- TOMBOL KEMBALI -->
    <a href="index.html" class="kembali">← Kembali ke Beranda</a>
</div>

<script>
    const SUPABASE_URL = 'https://luutehtjtsvivdyipjpy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1dXRlaHRqdHN2aXZkeWlwanB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjc5MDgsImV4cCI6MjEwNTY0MzkwOH0.74C0F1UmOOe53ObtIrqnh84MYeTfgW0EQXSgrhLyIeY';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // FUNGSI LOGIN GOOGLE SAJA
    async function loginDenganGoogle() {
        const btn = document.querySelector('.btn-google');
        btn.innerHTML = '⏳ Menghubungkan...';
        btn.disabled = true;

        const { data, error } = await client.auth.signInWithOAuth({
            provider: 'google',
            options: {
                // Mengarahkan langsung ke portal setelah login sukses
                redirectTo: window.location.origin + '/portal.html'
            }
        });

        if (error) {
            alert("Gagal terhubung dengan Google: " + error.message);
            btn.innerHTML = '<img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo"> Lanjutkan dengan Google';
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
