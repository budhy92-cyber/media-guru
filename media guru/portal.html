<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Portal Media Interaktif CBT B-TEK</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Desain Latar & Font Dasar */
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f0f4f8; 
            background-image: radial-gradient(#d7e1ec 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0; 
            padding: 20px; 
            color: #333;
        }

        /* Navigasi Atas */
        .navbar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: linear-gradient(135deg, #6e8efb, #a777e3); 
            color: white;
            padding: 15px 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(110, 142, 251, 0.3); 
            margin-bottom: 30px; 
            max-width: 1000px; 
            margin-left: auto; 
            margin-right: auto; 
        }
        .akun-info { font-weight: 600; font-size: 15px; }
        .kuota-badge { 
            background: #ff9f43; 
            color: white; 
            padding: 6px 15px; 
            border-radius: 20px; 
            font-size: 14px; 
            margin-left: 10px; 
            box-shadow: 0 2px 5px rgba(255, 159, 67, 0.4);
        }
        .btn-logout { 
            background: #ff4757; 
            color: white; 
            border: none; 
            padding: 8px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }
        .btn-logout:hover { background: #ff6b81; transform: scale(1.05); }

        /* Area Judul */
        .header { 
            text-align: center; 
            margin-bottom: 30px; 
            position: relative;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .header h1 { 
            font-size: 28px; 
            color: #2f3542; 
            margin-bottom: 5px;
            background: -webkit-linear-gradient(#6e8efb, #a777e3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: #57606f; font-size: 15px; }
        .karakter { font-size: 45px; position: absolute; top: -20px; }
        .karakter-kiri { left: 20px; transform: rotate(-10deg); }
        .karakter-kanan { right: 20px; transform: rotate(10deg); }

        /* AREA PENCARIAN & FILTER */
        .filter-container {
            max-width: 1000px;
            margin: 0 auto 30px auto;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            border-top: 4px solid #1dd1a1;
        }
        .filter-container input, .filter-container select {
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            flex: 1;
            min-width: 150px;
        }
        .filter-container input:focus, .filter-container select:focus {
            border-color: #1dd1a1;
            background: #f8fffc;
        }
        .filter-container input {
            flex: 2;
        }

        /* Grid Katalog */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px; 
            max-width: 1000px; 
            margin: 0 auto; 
            padding-bottom: 50px;
        }

        /* Desain Kartu Media */
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
            display: flex; 
            flex-direction: column; 
            transition: all 0.3s ease;
            border-top: 6px solid #1dd1a1; 
            position: relative;
            overflow: hidden;
        }
        .card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 12px 25px rgba(0,0,0,0.12); 
            border-top: 6px solid #ff9f43;
        }
        .card::after {
            content: '📚';
            position: absolute;
            right: -10px;
            bottom: -15px;
            font-size: 80px;
            opacity: 0.05;
            z-index: 0;
        }
        .badge-container { z-index: 1; margin-bottom: 12px; }
        .badge { 
            display: inline-block; 
            padding: 5px 10px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: bold;
            margin-right: 6px; 
            text-transform: uppercase;
        }
        .badge-kelas { background: #eccc68; color: #2f3542; }
        .badge-mapel { background: #7bed9f; color: #2f3542; }
        .judul { font-size: 19px; font-weight: 700; margin: 0 0 10px 0; color: #2f3542; z-index: 1; }
        .deskripsi { font-size: 13px; color: #747d8c; margin-bottom: 25px; flex-grow: 1; line-height: 1.6; z-index: 1; }
        
        .btn-buka { 
            background: linear-gradient(135deg, #1e90ff, #3742fa); 
            color: white; 
            text-align: center; 
            padding: 12px; 
            border-radius: 25px; 
            font-weight: 600; 
            font-family: 'Poppins', sans-serif;
            border: none; 
            cursor: pointer; 
            width: 100%; 
            transition: 0.3s;
            z-index: 1;
        }
        .btn-buka:hover { 
            background: linear-gradient(135deg, #3742fa, #1e90ff); 
            box-shadow: 0 5px 15px rgba(55, 66, 250, 0.4);
        }
        
        .data-kosong {
            text-align: center;
            width: 100%;
            grid-column: 1 / -1;
            color: #ff4757;
            font-weight: bold;
            padding: 20px;
        }

        /* Animasi Skeleton */
        @keyframes skeletonLoading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite;
            border-top: 6px solid #e1e8ed !important;
            height: 220px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="akun-info">
        Halo, <span id="teksEmail">Memuat...</span>
        <span class="kuota-badge">🚀 Kuota Gratis: <span id="teksKuota">-</span></span>
    </div>
    <button class="btn-logout" onclick="prosesLogout()">Keluar</button>
</div>

<div class="header">
    <div class="karakter karakter-kiri">👨‍🏫</div>
    <div class="karakter karakter-kanan">👩‍🎓</div>
    <h1>Katalog Media B-TEK</h1>
    <p>Pilih dan eksplorasi media interaktif di bawah ini.</p>
</div>

<!-- BARIS FILTER & PENCARIAN -->
<div class="filter-container">
    <input type="text" id="inputCari" placeholder="🔍 Cari judul atau deskripsi media..." onkeyup="saringData()">
    
    <select id="filterKelas" onchange="saringData()">
        <option value="semua">-- Semua Kelas --</option>
        <option value="kelas-1">Kelas 1</option>
        <option value="kelas-2">Kelas 2</option>
        <option value="kelas-3">Kelas 3</option>
        <option value="kelas-4">Kelas 4</option>
        <option value="kelas-5">Kelas 5</option>
        <option value="kelas-6">Kelas 6</option>
    </select>
    
    <select id="filterMapel" onchange="saringData()">
        <option value="semua">-- Semua Mapel --</option>
        <option value="Pendidikan Agama Islam">Pendidikan Agama Islam</option>
        <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
        <option value="Matematika">Matematika</option>
        <option value="IPAS">IPAS</option>
        <option value="Bahasa Inggris">Bahasa Inggris</option>
        <option value="Seni Rupa">Seni Rupa</option>
        <option value="Seni Musik">Seni Musik</option>
        <option value="Bahasa Makassar">Bahasa Makassar</option>
        <option value="Koding dan Kecerdasan Artifisial">Koding dan Kecerdasan Artifisial</option>
    </select>
</div>

<div class="grid-container" id="katalogMedia"></div>

<script>
    const SUPABASE_URL = 'https://luutehtjtsvivdyipjpy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1dXRlaHRqdHN2aXZkeWlwanB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjc5MDgsImV4cCI6MjEwNTY0MzkwOH0.74C0F1UmOOe53ObtIrqnh84MYeTfgW0EQXSgrhLyIeY';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let dataUser = null;
    let sisaKuota = 0;
    let semuaDataMedia = []; 
    let riwayatBuka = []; 

    async function cekLogin() {
        const { data: { session }, error } = await client.auth.getSession();
        if (!session) {
            window.location.href = "login.html";
            return;
        }
        dataUser = session.user;
        const namaPendek = dataUser.email.split('@')[0];
        document.getElementById('teksEmail').innerText = namaPendek;
        
        riwayatBuka = JSON.parse(localStorage.getItem('riwayat_btek_' + dataUser.id)) || [];
        
        await muatProfilGuru();
        await muatKatalog();
    }

    async function muatProfilGuru() {
        const { data, error } = await client.from('profil_guru').select('sisa_kuota').eq('id', dataUser.id).single();
        if (data) {
            sisaKuota = parseInt(data.sisa_kuota);
            document.getElementById('teksKuota').innerText = sisaKuota;
        }
    }

    function tampilkanSkeleton() {
        const katalog = document.getElementById('katalogMedia');
        katalog.innerHTML = '';
        for(let i=0; i<6; i++) {
            katalog.innerHTML += `<div class="card skeleton"></div>`;
        }
    }

    async function muatKatalog() {
        tampilkanSkeleton(); 
        
        const { data, error } = await client.from('daftar_media').select('*').order('id', { ascending: false });
        
        if (data) {
            semuaDataMedia = data; 
            saringData(); 
        }
    }

    function saringData() {
        const kataKunci = document.getElementById('inputCari').value.toLowerCase();
        const kelasPilihan = document.getElementById('filterKelas').value;
        const mapelPilihan = document.getElementById('filterMapel').value;
        const katalog = document.getElementById('katalogMedia');
        
        katalog.innerHTML = ''; 

        const dataTersaring = semuaDataMedia.filter(item => {
            const cocokKataKunci = item.judul.toLowerCase().includes(kataKunci) || item.deskripsi.toLowerCase().includes(kataKunci);
            const cocokKelas = (kelasPilihan === 'semua') || (item.kelas === kelasPilihan);
            const cocokMapel = (mapelPilihan === 'semua') || (item.mapel === mapelPilihan);
            return cocokKataKunci && cocokKelas && cocokMapel;
        });

        if (dataTersaring.length === 0) {
            katalog.innerHTML = `<div class="data-kosong">Data tidak ditemukan. Coba kata kunci atau filter lain.</div>`;
            return;
        }

        dataTersaring.forEach(item => {
            const idMediaString = String(item.id);
            const sudahPernah = riwayatBuka.includes(idMediaString);
            
            const teksTombol = sudahPernah ? '▶ Buka Lagi (Gratis)' : '▶ Buka Media';
            const warnaTombol = sudahPernah ? 'background: linear-gradient(135deg, #a29bfe, #6c5ce7);' : '';
            const badgeRiwayat = sudahPernah ? `<span class="badge" style="background:#a29bfe; color:white;">RIWAYAT</span>` : '';

            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div class="badge-container">
                    <span class="badge badge-kelas">${item.kelas.replace('-', ' ').toUpperCase()}</span>
                    <span class="badge badge-mapel">${item.mapel.toUpperCase()}</span>
                    ${badgeRiwayat}
                </div>
                <h3 class="judul">${item.judul}</h3>
                <p class="deskripsi">${item.deskripsi}</p>
                <button class="btn-buka" id="btn_${item.id}" style="${warnaTombol}" onclick="bukaMedia('${item.file_url}', 'btn_${item.id}', '${item.id}')">${teksTombol}</button>
            `;
            katalog.appendChild(card);
        });
    }

    async function bukaMedia(url, idTombol, idMedia) {
        const idMediaString = String(idMedia);
        const sudahPernah = riwayatBuka.includes(idMediaString);

        if (sisaKuota <= 0 && !sudahPernah) {
            const mauLangganan = confirm("MAAF, KUOTA GRATIS ANDA HABIS!\n\nSilakan Upgrade Premium untuk mendapatkan akses semua media tanpa batas.\n\nKlik 'OK' untuk menghubungi Admin via WhatsApp.");
            if (mauLangganan) {
                const nomorWA = "6281234567890"; 
                const pesan = `Halo Admin CBT B-TEK, saya ingin Upgrade Premium agar bisa mengakses semua media interaktif. Akun email saya: ${dataUser.email}`;
                window.location.href = `https://wa.me/${nomorWA}?text=${encodeURIComponent(pesan)}`;
            }
            return;
        }

        const tombol = document.getElementById(idTombol);
        const teksAsli = tombol.innerText;
        tombol.innerText = "⏳ Membuka...";
        tombol.disabled = true;

        const jendelaBaru = window.open("", "_blank");
        if (jendelaBaru) {
            jendelaBaru.document.write(`
                <h2 style="font-family:sans-serif; text-align:center; margin-top:50px; color:#3742fa;">
                    ⏳ Menyiapkan Media Pembelajaran...
                </h2>
            `);
        } else {
            alert("⚠️ Peringatan: Browser Anda memblokir pop-up! Izinkan pop-up untuk situs ini agar media dapat terbuka.");
            tombol.innerText = teksAsli;
            tombol.disabled = false;
            return;
        }

        try {
            if (!sudahPernah) {
                sisaKuota -= 1;
                document.getElementById('teksKuota').innerText = sisaKuota;
                await client.from('profil_guru').update({ sisa_kuota: sisaKuota }).eq('id', dataUser.id);
                
                riwayatBuka.push(idMediaString);
                localStorage.setItem('riwayat_btek_' + dataUser.id, JSON.stringify(riwayatBuka));
                
                setTimeout(() => saringData(), 500);
            }

            const respon = await fetch(url);
            const isiHtml = await respon.text();

            jendelaBaru.document.open();
            jendelaBaru.document.write(isiHtml);
            jendelaBaru.document.close();

        } catch (error) {
            jendelaBaru.close();
            alert("Gagal memuat media. Pastikan koneksi internet stabil.");
        } finally {
            tombol.innerText = teksAsli;
            tombol.disabled = false;
        }
    }

    async function prosesLogout() {
        await client.auth.signOut();
        window.location.href = "login.html";
    }

    cekLogin();
</script>

</body>
</html>
