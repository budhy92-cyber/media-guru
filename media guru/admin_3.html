<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Super Admin - CBT B-TEK</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f0f4f8;
            background-image: radial-gradient(#d7e1ec 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0; 
            padding: 40px 20px; 
            color: #333;
        }
        .container { 
            max-width: 600px; 
            background: white; 
            padding: 35px 30px; 
            border-radius: 20px; 
            margin: 0 auto; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-top: 6px solid #ff9f43; 
        }
        .header-admin { text-align: center; margin-bottom: 25px; }
        .header-admin h2 { margin: 10px 0 5px 0; color: #2f3542; font-size: 24px; }
        .header-admin p { color: #747d8c; font-size: 14px; margin: 0; }
        .karakter { font-size: 50px; line-height: 1; }

        label { display: block; font-weight: 600; margin-bottom: 8px; color: #2f3542; font-size: 14px; text-align: left; }
        input, select, textarea { 
            width: 100%; 
            padding: 12px 15px; 
            margin-bottom: 20px; 
            border: 2px solid #e1e8ed; 
            border-radius: 10px; 
            font-family: 'Poppins', sans-serif; 
            font-size: 14px; 
            box-sizing: border-box; 
            transition: 0.3s;
            background: #f8f9fa;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #ff9f43; background: white; }
        
        button { 
            width: 100%; 
            background: linear-gradient(135deg, #ff9f43, #ff6b81); 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            padding: 15px; 
            border-radius: 12px; 
            font-size: 14px; 
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover { box-shadow: 0 5px 15px rgba(255, 159, 67, 0.4); transform: translateY(-2px); }
        .file-input-wrapper { background: #fff3e0; padding: 15px; border-radius: 10px; border: 2px dashed #ff9f43; margin-bottom: 20px; text-align: center; }
        .file-input-wrapper input { margin-bottom: 0; border: none; background: transparent; }

        /* Navigasi Tiga Tab */
        .tab-container { display: flex; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { flex: 1; margin-top: 0; border-radius: 8px; padding: 12px 10px; font-size: 13px; min-width: 120px; }
        .tab-aktif { background: linear-gradient(135deg, #ff9f43, #ff6b81); color: white; }
        .tab-nonaktif { background: #cbd5e1; color: #333; }
        .tab-nonaktif:hover { background: #94a3b8; transform: translateY(0); box-shadow: none; }

        /* Modal Overlay untuk Form Edit */
        .modal-overlay { 
            display: none; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 9999; 
            justify-content: center; align-items: center; 
            padding: 20px; box-sizing: border-box;
        }
        .modal-content { 
            background: white; padding: 30px; border-radius: 20px; 
            width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; 
            position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-admin">
        <div class="karakter">⚙️👨‍💻</div>
        <h2>Panel Admin B-TEK</h2>
        <p>Kelola media interaktif dan pantau pengguna.</p>
    </div>

    <!-- Pilihan Navigasi Tab (Sekarang ada 3) -->
    <div class="tab-container">
        <button id="btnTabUpload" class="tab-btn tab-aktif" onclick="bukaTab('upload')">📤 Unggah</button>
        <button id="btnTabKelola" class="tab-btn tab-nonaktif" onclick="bukaTab('kelola')">📝 Kelola</button>
        <button id="btnTabStat" class="tab-btn tab-nonaktif" onclick="bukaTab('stat')">📊 Statistik</button>
    </div>

    <!-- TAB 1: AREA UNGGAH MEDIA -->
    <div id="formMedia">
        <label>📌 Judul Media</label>
        <input type="text" id="judul" placeholder="Contoh: Kuis Interaktif Tata Surya" required>

        <label>📝 Deskripsi Singkat</label>
        <textarea id="deskripsi" rows="3" placeholder="Tuliskan tujuan pembelajaran media ini..." required></textarea>

        <label>🏫 Target Kelas</label>
        <select id="kelas">
            <option value="kelas-1">Kelas 1</option>
            <option value="kelas-2">Kelas 2</option>
            <option value="kelas-3">Kelas 3</option>
            <option value="kelas-4">Kelas 4</option>
            <option value="kelas-5">Kelas 5</option>
            <option value="kelas-6">Kelas 6</option>
        </select>

        <label>📚 Mata Pelajaran</label>
        <select id="mapel">
            <option value="Pendidikan Agama Islam">Pendidikan Agama Islam</option>
            <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
            <option value="Bahasa Indonesia">Bahasa Indonesia</option>
            <option value="Matematika">Matematika</option>
            <option value="IPAS">IPAS</option>
            <option value="Bahasa Inggris">Bahasa Inggris</option>
            <option value="Seni Rupa">Seni Rupa</option>
            <option value="Seni Musik">Seni Musik</option>
            <option value="Bahasa Makassar">Bahasa Makassar</option>
            <option value="Koding dan Kecerdasan Artifisial">Koding dan Kecerdasan Artifisial</option>
        </select>

        <label>📂 Unggah File Media (.html)</label>
        <div class="file-input-wrapper">
            <input type="file" id="fileHtml" accept=".html" required>
        </div>

        <button id="btnSubmit">🚀 Unggah & Simpan ke Server</button>
        <p id="statusMssg" style="font-weight: 600; text-align: center; margin-top: 20px; font-size: 14px;"></p>
    </div>

    <!-- TAB 2: AREA KELOLA & EDIT MEDIA -->
    <div id="panelKelola" style="display: none;">
        <div id="tempatDaftarMedia" style="text-align: center;">
            <!-- List Media akan muncul di sini -->
        </div>
    </div>

    <!-- TAB 3: AREA STATISTIK -->
    <div id="panelStatistik" style="display: none;">
        <div id="tempatStatistik">
            <p style="text-align:center; color:#747d8c;">Klik segarkan untuk memuat data...</p>
        </div>
        <button onclick="muatStatistik()" style="background: linear-gradient(135deg, #1e90ff, #3742fa);">🔄 Segarkan Data Statistik</button>
    </div>

</div>

<!-- JENDELA POP-UP UNTUK EDIT MEDIA -->
<div class="modal-overlay" id="modalEdit">
    <div class="modal-content">
        <h3 style="margin-top:0; color:#2f3542; text-align:center; margin-bottom:20px;">✏️ Edit Data Media</h3>
        <input type="hidden" id="editId">
        
        <label>📌 Judul Media</label>
        <input type="text" id="editJudul" required>

        <label>📝 Deskripsi Singkat</label>
        <textarea id="editDeskripsi" rows="3" required></textarea>

        <label>🏫 Target Kelas</label>
        <select id="editKelas">
            <option value="kelas-1">Kelas 1</option>
            <option value="kelas-2">Kelas 2</option>
            <option value="kelas-3">Kelas 3</option>
            <option value="kelas-4">Kelas 4</option>
            <option value="kelas-5">Kelas 5</option>
            <option value="kelas-6">Kelas 6</option>
        </select>

        <label>📚 Mata Pelajaran</label>
        <select id="editMapel">
            <option value="Pendidikan Agama Islam">Pendidikan Agama Islam</option>
            <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
            <option value="Bahasa Indonesia">Bahasa Indonesia</option>
            <option value="Matematika">Matematika</option>
            <option value="IPAS">IPAS</option>
            <option value="Bahasa Inggris">Bahasa Inggris</option>
            <option value="Seni Rupa">Seni Rupa</option>
            <option value="Seni Musik">Seni Musik</option>
            <option value="Bahasa Makassar">Bahasa Makassar</option>
            <option value="Koding dan Kecerdasan Artifisial">Koding dan Kecerdasan Artifisial</option>
        </select>

        <div style="display:flex; gap:10px; margin-top:10px;">
            <button id="btnSimpanEdit" onclick="simpanEdit()" style="background:linear-gradient(135deg, #10b981, #059669); margin:0;">💾 Simpan Perubahan</button>
            <button onclick="tutupModal()" style="background:#cbd5e1; color:#333; margin:0;">Batal</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://luutehtjtsvivdyipjpy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1dXRlaHRqdHN2aXZkeWlwanB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjc5MDgsImV4cCI6MjEwNTY0MzkwOH0.74C0F1UmOOe53ObtIrqnh84MYeTfgW0EQXSgrhLyIeY';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let dataKelolaMedia = []; 

    function bukaTab(tab) {
        document.getElementById('formMedia').style.display = tab === 'upload' ? 'block' : 'none';
        document.getElementById('panelKelola').style.display = tab === 'kelola' ? 'block' : 'none';
        document.getElementById('panelStatistik').style.display = tab === 'stat' ? 'block' : 'none';
        
        document.getElementById('btnTabUpload').className = tab === 'upload' ? 'tab-btn tab-aktif' : 'tab-btn tab-nonaktif';
        document.getElementById('btnTabKelola').className = tab === 'kelola' ? 'tab-btn tab-aktif' : 'tab-btn tab-nonaktif';
        document.getElementById('btnTabStat').className = tab === 'stat' ? 'tab-btn tab-aktif' : 'tab-btn tab-nonaktif';
        
        if (tab === 'stat') muatStatistik();
        if (tab === 'kelola') muatKelolaMedia();
    }

    async function muatKelolaMedia() {
        const divData = document.getElementById('tempatDaftarMedia');
        divData.innerHTML = '<p style="color:#3742fa; font-weight:600;">⏳ Memuat daftar media...</p>';
        
        const { data, error } = await client.from('daftar_media').select('*').order('id', { ascending: false });
        
        if (error) { divData.innerHTML = '<p style="color:red;">Gagal memuat data.</p>'; return; }
        if (data.length === 0) { divData.innerHTML = '<p>Belum ada media yang diunggah.</p>'; return; }
        
        dataKelolaMedia = data; 
        
        let html = '';
        data.forEach(item => {
            html += `
            <div style="background:#f8f9fa; padding:15px 20px; border-radius:12px; margin-bottom:15px; border:1px solid #e1e8ed; text-align:left; position:relative;">
                <h4 style="margin:0 0 5px 0; color:#2f3542; font-size:16px;">${item.judul}</h4>
                <p style="margin:0 0 15px 0; font-size:12px; color:#747d8c;">
                    <span style="background:#eccc68; padding:2px 8px; border-radius:4px; color:#333;">${item.kelas.toUpperCase()}</span> 
                    <span style="background:#7bed9f; padding:2px 8px; border-radius:4px; color:#333;">${item.mapel.toUpperCase()}</span>
                </p>
                <div style="display:flex; gap:10px;">
                    <button onclick="siapkanEdit('${item.id}')" style="background:#1e90ff; padding:8px; font-size:13px; margin:0;">✏️ Edit</button>
                    <button onclick="hapusMedia('${item.id}')" style="background:#ff4757; padding:8px; font-size:13px; margin:0;">🗑️ Hapus</button>
                </div>
            </div>
            `;
        });
        divData.innerHTML = html;
    }

    function siapkanEdit(id) {
        const item = dataKelolaMedia.find(m => String(m.id) === String(id));
        if (!item) return;
        
        document.getElementById('editId').value = item.id;
        document.getElementById('editJudul').value = item.judul;
        document.getElementById('editDeskripsi').value = item.deskripsi;
        document.getElementById('editKelas').value = item.kelas;
        document.getElementById('editMapel').value = item.mapel;
        
        document.getElementById('modalEdit').style.display = 'flex'; 
    }

    function tutupModal() {
        document.getElementById('modalEdit').style.display = 'none';
    }

    async function simpanEdit() {
        const id = document.getElementById('editId').value;
        const judul = document.getElementById('editJudul').value;
        const deskripsi = document.getElementById('editDeskripsi').value;
        const kelas = document.getElementById('editKelas').value;
        const mapel = document.getElementById('editMapel').value;
        const btn = document.getElementById('btnSimpanEdit');
        
        if(!judul || !deskripsi) { alert("Judul dan Deskripsi tidak boleh kosong!"); return; }

        btn.innerText = '⏳ Menyimpan...';
        btn.disabled = true;
        
        const { error } = await client.from('daftar_media').update({
            judul: judul,
            deskripsi: deskripsi,
            kelas: kelas,
            mapel: mapel
        }).eq('id', id);
        
        btn.innerText = '💾 Simpan Perubahan';
        btn.disabled = false;
        
        if(error) {
            alert('Gagal menyimpan: ' + error.message);
        } else {
            alert('✅ Berhasil! Data media telah diperbarui.');
            tutupModal();
            muatKelolaMedia(); 
        }
    }
    
    async function hapusMedia(id) {
        const konfirmasi = confirm("⚠️ PERINGATAN!\n\nApakah Anda yakin ingin menghapus media ini dari katalog?\nData yang dihapus tidak dapat dikembalikan.");
        if(!konfirmasi) return;
        
        const { error } = await client.from('daftar_media').delete().eq('id', id);
        if(error) {
            alert('Gagal menghapus: ' + error.message);
        } else {
            muatKelolaMedia(); 
        }
    }

    async function muatStatistik() {
        const divStat = document.getElementById('tempatStatistik');
        divStat.innerHTML = '<p style="text-align:center; color:#3742fa; font-weight:600;">⏳ Menarik data dari server...</p>';
        try {
            const { data: media } = await client.from('daftar_media').select('id');
            const totalMedia = media ? media.length : 0;
            
            const { data: guru } = await client.from('profil_guru').select('id, sisa_kuota');
            const totalGuru = guru ? guru.length : 0;
            const butuhPremium = guru ? guru.filter(g => g.sisa_kuota <= 0).length : 0;

            divStat.innerHTML = `
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <div style="flex:1; background:#f8f9fa; padding:15px; border-radius:10px; text-align:center; border: 2px solid #e1e8ed;">
                        <h3 style="margin:0; color:#3742fa; font-size:26px;">${totalMedia}</h3>
                        <p style="margin:0; font-size:12px; color:#747d8c; font-weight:600;">Media Aktif</p>
                    </div>
                    <div style="flex:1; background:#f8f9fa; padding:15px; border-radius:10px; text-align:center; border: 2px solid #e1e8ed;">
                        <h3 style="margin:0; color:#10b981; font-size:26px;">${totalGuru}</h3>
                        <p style="margin:0; font-size:12px; color:#747d8c; font-weight:600;">Total Guru</p>
                    </div>
                </div>
                <div style="background:#fff0f1; padding:20px; border-radius:10px; text-align:center; border: 2px solid #ffccd5; margin-bottom:15px;">
                    <h3 style="margin:0; color:#ff4757; font-size:22px;">${butuhPremium} Guru</h3>
                    <p style="margin:0; font-size:13px; color:#ff4757; font-weight:600;">Kuota Habis (Prospek Upgrade)</p>
                </div>
            `;
        } catch (error) {
            divStat.innerHTML = '<p style="color:red; text-align:center;">Gagal memuat statistik jaringan.</p>';
        }
    }

    document.getElementById('btnSubmit').addEventListener('click', async function() {
        const btn = document.getElementById('btnSubmit');
        const status = document.getElementById('statusMssg');
        
        try {
            if (typeof window.supabase === 'undefined') {
                alert("Koneksi Supabase terblokir! Periksa koneksi internet Anda.");
                return;
            }

            const judul = document.getElementById('judul').value;
            const deskripsi = document.getElementById('deskripsi').value;
            const kelas = document.getElementById('kelas').value;
            const mapel = document.getElementById('mapel').value;
            const fileInput = document.getElementById('fileHtml');

            if (!judul || !deskripsi || fileInput.files.length === 0) {
                alert("Harap isi Judul, Deskripsi, dan pilih File HTML terlebih dahulu!");
                return;
            }

            const file = fileInput.files[0];
            btn.innerText = "⏳ Memproses...";
            btn.disabled = true;
            status.innerText = "Menghubungkan ke server...";
            status.style.color = "#3742fa";

            const namaFile = Date.now() + "_" + file.name;

            status.innerText = "Mengunggah file (Tahap 1/2)...";
            const { data: uploadData, error: uploadError } = await client.storage
                .from('media-interaktif')
                .upload(namaFile, file, {
                    contentType: 'text/html', 
                    cacheControl: '3600',
                    upsert: false
                });

            if (uploadError) throw uploadError;

            const { data: publicUrlData } = client.storage
                .from('media-interaktif')
                .getPublicUrl(namaFile);
            
            const fileUrl = publicUrlData.publicUrl;

            status.innerText = "Menyimpan data (Tahap 2/2)...";
            const { error: dbError } = await client
                .from('daftar_media')
                .insert([{ judul, deskripsi, kelas, mapel, file_url: fileUrl }]);

            if (dbError) throw dbError;

            status.style.color = "#10b981";
            status.innerText = "✅ SUKSES! Media berhasil ditambahkan.";
            alert("BERHASIL! Data sudah masuk ke Supabase.");

            document.getElementById('judul').value = '';
            document.getElementById('deskripsi').value = '';
            document.getElementById('fileHtml').value = '';

        } catch (error) {
            alert("ERROR: " + error.message);
            status.style.color = "#ff4757";
            status.innerText = "❌ GAGAL: " + error.message;
        } finally {
            btn.innerText = "🚀 Unggah & Simpan ke Server";
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
